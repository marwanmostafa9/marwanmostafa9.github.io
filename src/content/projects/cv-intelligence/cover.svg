<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="CVs are embedded into a vector space, matched against a job description, and ranked">
<defs>
<radialGradient id="cvi-bg" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#a78bfa" stop-opacity=".24"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="cvi-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
<filter id="cvi-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="cvi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
</defs>
<rect width="800" height="450" fill="#070912"/>
<rect width="800" height="450" fill="url(#cvi-bg)"/>
<rect width="800" height="450" fill="url(#cvi-dots)"/>
<!-- CV stack -->
<g transform="rotate(-9 130 230)"><rect x="70" y="150" width="120" height="160" rx="8" fill="#12152a" stroke="#fff" stroke-opacity=".12"/></g>
<g transform="rotate(6 140 230)"><rect x="80" y="150" width="120" height="160" rx="8" fill="#151933" stroke="#fff" stroke-opacity=".15"/></g>
<rect x="75" y="145" width="120" height="160" rx="8" fill="#1a1e3b" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/>
<circle cx="100" cy="172" r="12" fill="#a78bfa" fill-opacity=".35"/>
<g fill="#fff" fill-opacity=".3">
<rect x="120" y="164" width="58" height="6" rx="3"/><rect x="120" y="176" width="40" height="5" rx="2.5"/>
<rect x="90" y="200" width="88" height="5" rx="2.5"/><rect x="90" y="212" width="70" height="5" rx="2.5"/>
<rect x="90" y="236" width="88" height="5" rx="2.5"/><rect x="90" y="272" width="60" height="5" rx="2.5"/><rect x="90" y="284" width="80" height="5" rx="2.5"/>
</g>
<g fill="#a78bfa"><rect x="90" y="224" width="52" height="7" rx="3.5"/><rect x="90" y="248" width="34" height="7" rx="3.5"/><rect x="128" y="248" width="44" height="7" rx="3.5"/><rect x="90" y="260" width="46" height="7" rx="3.5"/></g>
<path d="M222 228H278" stroke="#a78bfa" stroke-width="2" marker-end="url(#cvi-arrow)"/>
<!-- vector space -->
<circle cx="390" cy="228" r="100" fill="#a78bfa" fill-opacity=".04" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="4 6"/>
<g fill="#fff" fill-opacity=".35">
<circle cx="330" cy="180" r="3.5"/><circle cx="345" cy="270" r="3.5"/><circle cx="318" cy="232" r="3.5"/><circle cx="360" cy="152" r="3.5"/><circle cx="452" cy="268" r="3.5"/><circle cx="440" cy="300" r="3.5"/><circle cx="372" cy="300" r="3.5"/><circle cx="335" cy="300" r="3.5"/><circle cx="460" cy="190" r="3.5"/><circle cx="352" cy="214" r="3.5"/><circle cx="398" cy="148" r="3.5"/><circle cx="470" cy="236" r="3.5"/><circle cx="305" cy="262" r="3.5"/><circle cx="388" cy="318" r="3.5"/>
</g>
<circle cx="410" cy="212" r="26" fill="none" stroke="#a78bfa" stroke-opacity=".45"/>
<circle cx="410" cy="212" r="48" fill="none" stroke="#a78bfa" stroke-opacity=".22"/>
<g stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.3"><path d="M410 212L392 196M410 212L430 230M410 212L396 236"/></g>
<g fill="#a78bfa" filter="url(#cvi-glow)"><circle cx="392" cy="196" r="5.5"/><circle cx="430" cy="230" r="5.5"/><circle cx="396" cy="236" r="5.5"/></g>
<path d="M410 200L422 212L410 224L398 212Z" fill="#fff" filter="url(#cvi-glow)"/>
<text x="428" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#fff" font-weight="700">JD</text>
<path d="M502 228H546" stroke="#a78bfa" stroke-width="2" marker-end="url(#cvi-arrow)"/>
<!-- ranking -->
<g font-family="JetBrains Mono, ui-monospace, monospace">
<rect x="560" y="128" width="210" height="200" rx="14" fill="#0b0e1c" stroke="#fff" stroke-opacity=".1"/>
<text x="578" y="156" font-size="12" fill="#fff" fill-opacity=".45">ranked candidates</text>
<rect x="572" y="170" width="186" height="34" rx="8" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".6"/>
<text x="584" y="192" font-size="14" fill="#fff" font-weight="700">#1</text>
<rect x="616" y="183" width="90" height="8" rx="4" fill="#a78bfa"/>
<text x="746" y="192" font-size="13" fill="#fff" text-anchor="end">.94</text>
<text x="584" y="234" font-size="14" fill="#fff" fill-opacity=".7">#2</text>
<rect x="616" y="225" width="82" height="8" rx="4" fill="#a78bfa" fill-opacity=".7"/>
<text x="746" y="234" font-size="13" fill="#fff" fill-opacity=".7" text-anchor="end">.89</text>
<text x="584" y="270" font-size="14" fill="#fff" fill-opacity=".55">#3</text>
<rect x="616" y="261" width="70" height="8" rx="4" fill="#a78bfa" fill-opacity=".5"/>
<text x="746" y="270" font-size="13" fill="#fff" fill-opacity=".55" text-anchor="end">.81</text>
<text x="584" y="306" font-size="14" fill="#fff" fill-opacity=".4">#4</text>
<rect x="616" y="297" width="52" height="8" rx="4" fill="#a78bfa" fill-opacity=".3"/>
<text x="746" y="306" font-size="13" fill="#fff" fill-opacity=".4" text-anchor="end">.72</text>
<g font-size="13" fill="#fff" fill-opacity=".45" text-anchor="middle">
<text x="135" y="375">parse</text><text x="390" y="375">embed · search</text><text x="665" y="375">rank · compare</text>
</g>
<text x="28" y="40" font-size="18" fill="#a78bfa" fill-opacity=".85">// cv_intelligence</text>
<text x="772" y="40" font-size="18" fill="#fff" fill-opacity=".3" text-anchor="end">RAG · vector db</text>
</g>
</svg>
