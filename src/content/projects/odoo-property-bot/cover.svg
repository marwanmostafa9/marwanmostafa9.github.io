<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A Telegram chat message is read by an LLM inside an n8n workflow and turned into a filled Odoo property form">
<defs>
<radialGradient id="op-bg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#34d399" stop-opacity=".18"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<pattern id="op-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
<filter id="op-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="450" fill="#070912"/>
<rect width="800" height="450" fill="url(#op-bg)"/>
<rect width="800" height="450" fill="url(#op-dots)"/>
<!-- phone with chat -->
<rect x="44" y="78" width="200" height="320" rx="24" fill="#111426" stroke="#fff" stroke-opacity=".18"/>
<rect x="44" y="78" width="200" height="46" rx="24" fill="#1b1f36"/>
<rect x="44" y="104" width="200" height="20" fill="#1b1f36"/>
<circle cx="72" cy="101" r="12" fill="#38bdf8"/>
<path d="M66 101l11-5-3 11-3-3z" fill="#fff"/>
<text x="92" y="106" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Odoo Bot</text>
<g font-family="Inter, system-ui, sans-serif" font-size="11">
<rect x="58" y="138" width="130" height="34" rx="10" fill="#23273f"/>
<text x="68" y="153" fill="#fff" fill-opacity=".75">What is the</text>
<text x="68" y="166" fill="#fff" fill-opacity=".75">property name?</text>
<rect x="134" y="182" width="96" height="24" rx="10" fill="#7c3aed"/>
<text x="144" y="198" fill="#fff">Demo Villa 1</text>
<rect x="72" y="216" width="158" height="62" rx="10" fill="#7c3aed"/>
<text x="82" y="233" fill="#fff">a villa with 3 bedrooms</text>
<text x="82" y="248" fill="#fff">and a garage, no</text>
<text x="82" y="263" fill="#fff">garden, sea view</text>
<rect x="58" y="288" width="130" height="24" rx="10" fill="#23273f"/>
<text x="68" y="304" fill="#fff" fill-opacity=".75">Expected price?</text>
<rect x="160" y="322" width="70" height="24" rx="10" fill="#7c3aed"/>
<text x="170" y="338" fill="#fff">5 million</text>
<rect x="58" y="356" width="150" height="24" rx="10" fill="#23273f" stroke="#34d399" stroke-opacity=".6"/>
<text x="68" y="372" fill="#34d399">Property created ✓</text>
</g>
<!-- flow to n8n + LLM -->
<path d="M256 238H300" stroke="#34d399" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M298 231L310 238L298 245Z" fill="#34d399"/>
<rect x="318" y="150" width="164" height="176" rx="16" fill="none" stroke="#34d399" stroke-opacity=".45" stroke-dasharray="5 6"/>
<text x="400" y="174" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#34d399" fill-opacity=".8" text-anchor="middle">n8n workflow</text>
<circle cx="400" cy="236" r="34" fill="#0f2a22" stroke="#34d399" stroke-width="2" filter="url(#op-glow)"/>
<text x="400" y="243" font-family="Space Grotesk, Inter, sans-serif" font-size="20" font-weight="700" fill="#d1fae5" text-anchor="middle">LLM</text>
<g fill="#34d399" fill-opacity=".9"><circle cx="350" cy="300" r="5"/><circle cx="400" cy="300" r="5"/><circle cx="450" cy="300" r="5"/></g>
<path d="M355 300H395M405 300H445" stroke="#34d399" stroke-opacity=".6"/>
<path d="M400 270V295" stroke="#34d399" stroke-opacity=".6"/>
<path d="M492 238H536" stroke="#34d399" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M534 231L546 238L534 245Z" fill="#34d399"/>
<!-- Odoo form -->
<rect x="556" y="100" width="210" height="276" rx="14" fill="#f8fafc" fill-opacity=".06" stroke="#fff" stroke-opacity=".2"/>
<text x="574" y="132" font-family="Space Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#fff">Demo Villa 1</text>
<rect x="696" y="117" width="54" height="20" rx="10" fill="#a78bfa" fill-opacity=".25"/>
<text x="723" y="131" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">New</text>
<g font-family="Inter, system-ui, sans-serif" font-size="12">
<text x="574" y="166" fill="#fff" fill-opacity=".45">Type</text><text x="748" y="166" fill="#fff" text-anchor="end">Villa</text>
<text x="574" y="194" fill="#fff" fill-opacity=".45">Expected price</text><text x="748" y="194" fill="#fff" text-anchor="end">5,000,000</text>
<text x="574" y="222" fill="#fff" fill-opacity=".45">Bedrooms</text><text x="748" y="222" fill="#fff" text-anchor="end">3</text>
<text x="574" y="250" fill="#fff" fill-opacity=".45">Garage</text>
<text x="574" y="278" fill="#fff" fill-opacity=".45">Garden</text>
<text x="574" y="306" fill="#fff" fill-opacity=".45">Description</text>
<text x="748" y="306" fill="#fff" text-anchor="end">Sea view</text>
</g>
<rect x="734" y="239" width="14" height="14" rx="3" fill="#34d399"/>
<path d="M737 246l3 3 5-6" stroke="#070912" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="734" y="267" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-opacity=".4"/>
<g stroke="#fff" stroke-opacity=".08"><path d="M574 176H748M574 204H748M574 232H748M574 260H748M574 288H748"/></g>
<rect x="574" y="330" width="174" height="30" rx="8" fill="#34d399" fill-opacity=".16" stroke="#34d399" stroke-opacity=".5"/>
<text x="661" y="350" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#6ee7b7" text-anchor="middle">record created</text>
<g font-family="JetBrains Mono, ui-monospace, monospace">
<text x="28" y="40" font-size="18" fill="#34d399" fill-opacity=".85">// chat → odoo</text>
<text x="772" y="40" font-size="18" fill="#fff" fill-opacity=".3" text-anchor="end">no forms</text>
</g>
</svg>
