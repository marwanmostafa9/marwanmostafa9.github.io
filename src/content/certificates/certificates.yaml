# The certificate shelf.
# To add one: drop the image in this folder, then add an entry below.
# Entries show on the shelf in the order they appear in this file.
#
#   - id: short-unique-name
#     title: What the certificate is for
#     issuer: Who gave it
#     shelf: course | recognition
#     date: '2025-06-15'      # or '2025-06' or '2025', optional
#     image: file-name.jpeg   # file in this folder
#     note: one short line     # optional
#     accent: '#4ade80'        # optional glow color
#     url: https://…          # optional verify link

